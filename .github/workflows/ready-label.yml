# Keeps the `ready` label true: an open issue is ready when none of its "blocked by" issues are
# still open and nobody has claimed it with `in-progress`. A pull request that closes an issue
# claims it automatically.
name: Ready label

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: "0 3 * * *" # catches blocked-by links added or removed in the UI, which fire no event
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: ready-label
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            if (context.eventName === "pull_request") {
              const pr = context.payload.pull_request;
              const refs = [...(pr.body || "").matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)];
              for (const [, n] of refs) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: +n, labels: ["in-progress"] });
              }
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
            for (const issue of issues.filter((i) => !i.pull_request)) {
              const labels = issue.labels.map((l) => l.name);
              const { data: blockers } = await github.request(
                "GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by",
                { owner, repo, issue_number: issue.number },
              );
              const ready = !labels.includes("in-progress") && !blockers.some((b) => b.state === "open");
              if (ready && !labels.includes("ready")) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ["ready"] });
                core.info(`#${issue.number} is now ready`);
              } else if (!ready && labels.includes("ready")) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "ready" });
                core.info(`#${issue.number} is no longer ready`);
              }
            }
